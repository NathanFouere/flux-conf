apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strategia
  namespace: strategia
spec:
  values:
    server:
      image:
        repository: nathanfouere/strategia-server
        pullPolicy: IfNotPresent
        tag: "main"

    client:
      image:
        repository: nathanfouere/strategia-client
        pullPolicy: IfNotPresent
        tag: "main"