apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strategia
  namespace: strategia
spec:
  releaseName: strategia
  chart:
    spec:
      chart: strategia
      version: "0.0.8"
      sourceRef:
        kind: HelmRepository
        name: strategia
  interval: 50m
  install:
    remediation:
      retries: 3