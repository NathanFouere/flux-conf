apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: media
  labels:
    app.kubernetes.io/name: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: advplyr/audiobookshelf:2.38.0
          resources:
            requests:
              memory: 320Mi
            limits:
              memory: 1Gi
          env:
            - name: TZ
              value: Europe/Paris
            # La box (192.168.1.1) fait du DNS64 : AAAA synthétiques 64:ff9b::/96.
            # Node (Happy Eyeballs) les essaie et ssrf-req-filter les bloque
            # ("Call to 64:ff9b::… is blocked") -> aucun flux podcast.
            # Bug connu : https://github.com/advplyr/audiobookshelf/issues/5288
            # Fix en cours : https://github.com/advplyr/audiobookshelf/pull/5377
            # Contournement proposé dans le ticket : désactive le filtre SSRF
            # (cf. CVE-2023-51697), sans autre protection réseau sur ce pod.
            # TODO: retirer dès qu'une version d'audiobookshelf inclut la PR #5377.
            - name: DISABLE_SSRF_REQUEST_FILTER
              value: "1"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: metadata
              mountPath: /metadata
            - name: library
              mountPath: /audiobooks
              subPath: audiobooks
            - name: library
              mountPath: /podcasts
              subPath: podcasts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
        - name: library
          persistentVolumeClaim:
            claimName: audiobookshelf-library
