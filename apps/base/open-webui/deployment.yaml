apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.3
          env:
            - name: WEBUI_URL
              value: "https://chat.nathan-fouere.com"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: webui-secret-key
            - name: WEBUI_ADMIN_EMAIL
              value: "nathan@nathan-fouere.com"
            - name: WEBUI_ADMIN_NAME
              value: "Nathan"
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: admin-password
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URLS
              value: "https://api.z.ai/api/coding/paas/v4"
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: open-webui-secrets
                  key: glm-api-key
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
            - name: TZ
              value: "Europe/Paris"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
