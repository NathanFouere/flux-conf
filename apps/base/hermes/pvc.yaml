apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-memory-pvc
  labels:
    app.kubernetes.io/name: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-skills-pvc
  labels:
    app.kubernetes.io/name: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
