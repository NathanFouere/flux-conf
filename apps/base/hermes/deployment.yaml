apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      shareProcessNamespace: true
      # L'image n'accepte que l'uid du user hermes (10000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.9.24
          # Contourne l'entrypoint s6-overlay, qui exige de démarrer en root
          command: ["hermes", "gateway", "run"]
          env:
            - name: GLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: glm-api-key
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: telegram-token
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: telegram-allowed-users
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: gh-token
            - name: HERMES_TELEMETRY
              value: "disabled"
            - name: TZ
              value: "Europe/Paris"
            - name: GATEWAY_MULTIPLEX_PROFILES
              value: "true"
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: skills
              mountPath: /opt/data/skills
            - name: agent-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: hermes-dashboard
          image: nousresearch/hermes-agent:v2026.9.24
          command: ["hermes", "dashboard", "--host", "0.0.0.0", "--port", "9119", "--no-open"]
          env:
            - name: GLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: glm-api-key
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: gh-token
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: nathan
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: webui-password
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: dashboard-auth-secret
            - name: HERMES_TELEMETRY
              value: "disabled"
            - name: TZ
              value: "Europe/Paris"
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: skills
              mountPath: /opt/data/skills
            - name: dashboard-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-memory-pvc
        - name: skills
          persistentVolumeClaim:
            claimName: hermes-skills-pvc
        - name: agent-tmp
          emptyDir: {}
        - name: dashboard-tmp
          emptyDir: {}
