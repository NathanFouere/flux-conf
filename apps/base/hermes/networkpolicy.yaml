apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-egress
  labels:
    app.kubernetes.io/name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # API kernel de SiYuan (siyuan.siyuan.svc.cluster.local:6806) pour le profil notes
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: siyuan
          podSelector:
            matchLabels:
              app.kubernetes.io/name: siyuan
      ports:
        - protocol: TCP
          port: 6806
