apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-desktop
  labels:
    app.kubernetes.io/name: anki-desktop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anki-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anki-desktop
    spec:
      # Le moteur web de Qt (Chromium) a besoin des syscalls bloqués par le profil seccomp par défaut
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: anki-desktop
          image: chrislongros/anki-desktop:25.09
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Paris"
            # Basic auth de l'interface KasmVNC (exposée publiquement)
            - name: CUSTOM_USER
              value: nathan
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anki-secrets
                  key: desktop-password
            # Synchro directe avec anki-sync, sans passer par le tunnel
            - name: ANKI_SYNC_SERVER
              value: "http://anki-sync.anki.svc.cluster.local:8080/"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ankiconnect
              containerPort: 8765
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: anki-desktop-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
