apiVersion: v1
kind: Service
metadata:
  name: anki-desktop
  labels:
    app.kubernetes.io/name: anki-desktop
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: ankiconnect
      port: 8765
      targetPort: 8765
      protocol: TCP
  selector:
    app.kubernetes.io/name: anki-desktop
