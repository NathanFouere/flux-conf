apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anki
  namespace: anki
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - anki.nathan-fouere.com
  rules:
    # Serveur de synchro : endpoint https://anki.nathan-fouere.com/ à renseigner dans AnkiDroid,
    # AnkiMobile et Anki Desktop
    - backendRefs:
        - name: anki-sync
          port: 8080
