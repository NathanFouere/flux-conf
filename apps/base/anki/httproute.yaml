apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anki
  namespace: anki
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  hostnames:
    - anki.nathan-fouere.com
  rules:
    # Protocole de synchro Anki (collection et médias) : endpoint https://anki.nathan-fouere.com/
    # à renseigner dans AnkiDroid / AnkiMobile / Anki Desktop
    - matches:
        - path:
            type: PathPrefix
            value: /sync
        - path:
            type: PathPrefix
            value: /msync
      backendRefs:
        - name: anki-sync
          port: 8080
    # Tout le reste : Anki Desktop dans le navigateur (KasmVNC, basic auth)
    - backendRefs:
        - name: anki-desktop
          port: 3000
