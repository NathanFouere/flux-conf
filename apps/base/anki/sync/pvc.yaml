apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anki-sync-data
  labels:
    app.kubernetes.io/name: anki-sync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anki-sync-backups
  labels:
    app.kubernetes.io/name: anki-sync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
