---
# cf . # cf . https://www.phillipsj.net/posts/k3s-enable-nfs-storage/
# note ici "The provisioned storage limit is not enforced. The application can expand to use all the available storage regardless of the provisioned size." donc le storage demandé est juste cosmétique
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: nfs
  namespace: default
spec:
  chart: nfs-subdir-external-provisioner
  repo: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
  targetNamespace: default
  set:
    nfs.server: 192.168.1.210
    nfs.path: /export/nfs-share
    storageClass.name: nfs